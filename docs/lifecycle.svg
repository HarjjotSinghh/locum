<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="m-arrow"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="m-green"/>
    </marker>
  </defs>
  <style>
    .t-title { fill: #1f2328; } .t-sub { fill: #59636e; }
    .t-node { fill: #1f2328; } .t-nsub { fill: #59636e; }
    .box { fill: #ffffff; stroke: #d0d7de; }
    .qbox { fill: none; stroke: #9a6700; }
    .rbox { fill: #ffffff; stroke: #9a6700; }
    .dbox { fill: #ffffff; stroke: #1a7f37; }
    .ebox { fill: #fff5f5; stroke: #d1242c; } .etext { fill: #d1242c; }
    .arrow { stroke: #818b98; } .m-arrow { fill: #818b98; }
    .gline { stroke: #1a7f37; } .m-green { fill: #1a7f37; } .gtext { fill: #1a7f37; }
    @media (prefers-color-scheme: dark) {
      .t-title { fill: #e7e7ea; } .t-sub { fill: #9a9aa4; }
      .t-node { fill: #e7e7ea; } .t-nsub { fill: #9a9aa4; }
      .box { fill: #141417; stroke: #26262c; }
      .qbox { stroke: #e0b568; }
      .rbox { fill: #141417; stroke: #e0b568; }
      .dbox { fill: #141417; stroke: #7ec699; }
      .ebox { fill: #1a1a1e; stroke: #e08a8a; } .etext { fill: #e08a8a; }
      .arrow { stroke: #6e6e78; } .m-arrow { fill: #6e6e78; }
      .gline { stroke: #7ec699; } .m-green { fill: #7ec699; } .gtext { fill: #7ec699; }
    }
  </style>
  <text x="32" y="46" font-size="20" font-weight="600" class="t-title">One job, start to finish</text>
  <text x="32" y="70" font-size="13" class="t-sub">The Bot delegates once, then polls &#8212; or sleeps until the webhook wakes it.</text>

  <rect x="24" y="120" width="146" height="68" rx="10" class="box"/>
  <text x="97" y="150" font-size="13" class="t-node" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">delegate_*</text>
  <text x="97" y="168" font-size="11" class="t-nsub" text-anchor="middle">returns job_id</text>

  <line x1="172" y1="154" x2="203" y2="154" class="arrow" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="205" y="120" width="120" height="68" rx="10" class="qbox" stroke-dasharray="5 4"/>
  <text x="265" y="150" font-size="14" font-weight="600" class="t-node" text-anchor="middle">queued</text>
  <text x="265" y="168" font-size="11" class="t-nsub" text-anchor="middle">waits for a slot</text>

  <line x1="327" y1="154" x2="358" y2="154" class="arrow" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="360" y="120" width="150" height="68" rx="10" class="rbox"/>
  <text x="435" y="150" font-size="14" font-weight="600" class="t-node" text-anchor="middle">running</text>
  <text x="435" y="168" font-size="11" class="t-nsub" text-anchor="middle">CLI is working</text>

  <line x1="512" y1="154" x2="543" y2="154" class="arrow" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="545" y="120" width="130" height="68" rx="10" class="dbox"/>
  <text x="610" y="150" font-size="14" font-weight="600" class="t-node" text-anchor="middle">done</text>
  <text x="610" y="168" font-size="11" class="t-nsub" text-anchor="middle">result + git diff</text>

  <line x1="677" y1="154" x2="743" y2="154" class="gline" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#ag)"/>
  <text x="710" y="144" font-size="12" class="gtext" text-anchor="middle">webhook</text>

  <rect x="745" y="120" width="191" height="68" rx="10" class="box"/>
  <text x="840" y="150" font-size="14" font-weight="600" class="t-node" text-anchor="middle">your routine</text>
  <text x="840" y="168" font-size="11" class="t-nsub" text-anchor="middle">wakes the Bot</text>

  <rect x="360" y="232" width="150" height="72" rx="10" class="box"/>
  <text x="435" y="261" font-size="13" font-weight="600" class="t-node" text-anchor="middle">check_job polls</text>
  <text x="435" y="279" font-size="11" class="t-nsub" text-anchor="middle">~30s &#183; turns &#183; activity</text>
  <line x1="435" y1="190" x2="435" y2="230" class="arrow" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>

  <rect x="545" y="232" width="130" height="40" rx="8" class="ebox"/>
  <text x="610" y="257" font-size="12" class="etext" text-anchor="middle">error / timeout</text>
  <line x1="610" y1="190" x2="610" y2="230" class="arrow" stroke-width="1.5" marker-end="url(#a)"/>

  <path d="M 545 170 H 528 V 344 H 97 V 192" fill="none" class="gline" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#ag)"/>
  <text x="315" y="336" font-size="12" class="gtext" text-anchor="middle">follow-up? resume_* keeps the session, skips the cold start</text>
</svg>
