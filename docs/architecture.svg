<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="m-arrow"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="m-green"/>
    </marker>
  </defs>
  <style>
    .t-title { fill: #1f2328; } .t-sub { fill: #59636e; } .t-faint { fill: #818b98; }
    .t-node { fill: #1f2328; } .t-nsub { fill: #59636e; }
    .box { fill: #ffffff; stroke: #d0d7de; }
    .chip { fill: #f6f8fa; stroke: #d0d7de; }
    .zone { fill: none; stroke: #d0d7de; }
    .arrow { stroke: #818b98; } .m-arrow { fill: #818b98; }
    .gline { stroke: #1a7f37; } .m-green { fill: #1a7f37; } .gtext { fill: #1a7f37; }
    @media (prefers-color-scheme: dark) {
      .t-title { fill: #e7e7ea; } .t-sub { fill: #9a9aa4; } .t-faint { fill: #6e6e78; }
      .t-node { fill: #e7e7ea; } .t-nsub { fill: #9a9aa4; }
      .box { fill: #141417; stroke: #26262c; }
      .chip { fill: #1a1a1e; stroke: #26262c; }
      .zone { stroke: #26262c; }
      .arrow { stroke: #6e6e78; } .m-arrow { fill: #6e6e78; }
      .gline { stroke: #7ec699; } .m-green { fill: #7ec699; } .gtext { fill: #7ec699; }
    }
  </style>
  <text x="32" y="46" font-size="20" font-weight="600" class="t-title">How a delegation flows</text>
  <text x="32" y="70" font-size="13" class="t-sub">Grok Bot can&#8217;t reach your machine, so Locum meets it halfway.</text>

  <rect x="24" y="96" width="200" height="180" rx="14" class="zone" stroke-dasharray="5 5"/>
  <text x="40" y="122" font-size="12" class="t-faint">xAI cloud</text>
  <rect x="44" y="140" width="160" height="96" rx="10" class="box"/>
  <text x="124" y="182" font-size="15" font-weight="600" class="t-node" text-anchor="middle">Grok Bot</text>
  <text x="124" y="202" font-size="12" class="t-nsub" text-anchor="middle">your Bot</text>

  <rect x="280" y="140" width="170" height="96" rx="10" class="box"/>
  <text x="365" y="182" font-size="15" font-weight="600" class="t-node" text-anchor="middle">Tunnel</text>
  <text x="365" y="202" font-size="12" class="t-nsub" text-anchor="middle">cloudflared</text>

  <rect x="506" y="96" width="430" height="180" rx="14" class="zone" stroke-dasharray="5 5"/>
  <text x="522" y="122" font-size="12" class="t-faint">your Mac</text>
  <rect x="526" y="140" width="170" height="96" rx="10" class="box"/>
  <text x="611" y="182" font-size="15" font-weight="600" class="t-node" text-anchor="middle">Locum server</text>
  <text x="611" y="202" font-size="11.5" class="t-nsub" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">127.0.0.1:8791</text>

  <rect x="730" y="140" width="186" height="44" rx="8" class="chip"/>
  <text x="823" y="167" font-size="13" class="t-node" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">claude -p</text>
  <rect x="730" y="192" width="186" height="44" rx="8" class="chip"/>
  <text x="823" y="219" font-size="13" class="t-node" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">codex exec</text>
  <text x="823" y="258" font-size="11" class="t-faint" text-anchor="middle">(your subscriptions)</text>

  <line x1="206" y1="188" x2="278" y2="188" class="arrow" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="242" y="132" font-size="12" class="t-nsub" text-anchor="middle">MCP tool call</text>
  <line x1="452" y1="188" x2="524" y2="188" class="arrow" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="481" y="132" font-size="12" class="t-nsub" text-anchor="middle">HTTPS</text>
  <line x1="698" y1="162" x2="728" y2="162" class="arrow" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="698" y1="214" x2="728" y2="214" class="arrow" stroke-width="1.5" marker-end="url(#a)"/>

  <path d="M 611 236 V 312 H 124 V 240" fill="none" class="gline" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#ag)"/>
  <text x="367" y="304" font-size="12" class="gtext" text-anchor="middle">completion webhook wakes the Bot</text>
</svg>
