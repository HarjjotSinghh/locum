<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6e6e78"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="338" rx="16" fill="#0b0b0d" stroke="#26262c"/>
  <text x="32" y="46" font-size="20" font-weight="600" fill="#e7e7ea">Running in three steps</text>
  <text x="32" y="70" font-size="13" fill="#9a9aa4">About ten minutes, most of it waiting on logins.</text>

  <rect x="24" y="100" width="280" height="150" rx="12" fill="#141417" stroke="#26262c"/>
  <circle cx="54" cy="132" r="14" fill="#1a1a1e" stroke="#26262c"/>
  <text x="54" y="137" font-size="14" font-weight="600" fill="#e7e7ea" text-anchor="middle">1</text>
  <text x="78" y="138" font-size="15" font-weight="600" fill="#e7e7ea">Start the server</text>
  <text x="44" y="172" font-size="12" fill="#e7e7ea" font-family="ui-monospace, Menlo, Consolas, monospace">cp .env.example .env</text>
  <text x="44" y="194" font-size="12" fill="#e7e7ea" font-family="ui-monospace, Menlo, Consolas, monospace">uv run server.py</text>
  <text x="44" y="224" font-size="11" fill="#9a9aa4">set LOCUM_TOKEN + LOCUM_ROOTS first</text>

  <line x1="306" y1="175" x2="342" y2="175" stroke="#6e6e78" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="344" y="100" width="280" height="150" rx="12" fill="#141417" stroke="#26262c"/>
  <circle cx="374" cy="132" r="14" fill="#1a1a1e" stroke="#26262c"/>
  <text x="374" y="137" font-size="14" font-weight="600" fill="#e7e7ea" text-anchor="middle">2</text>
  <text x="398" y="138" font-size="15" font-weight="600" fill="#e7e7ea">Open the tunnel</text>
  <text x="364" y="172" font-size="12" fill="#e7e7ea" font-family="ui-monospace, Menlo, Consolas, monospace">cloudflared tunnel</text>
  <text x="364" y="194" font-size="12" fill="#e7e7ea" font-family="ui-monospace, Menlo, Consolas, monospace">--url http://127.0.0.1:8791</text>
  <text x="364" y="224" font-size="11" fill="#9a9aa4">grab a stable hostname after</text>

  <line x1="626" y1="175" x2="662" y2="175" stroke="#6e6e78" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="664" y="100" width="272" height="150" rx="12" fill="#141417" stroke="#26262c"/>
  <circle cx="694" cy="132" r="14" fill="#1a1a1e" stroke="#26262c"/>
  <text x="694" y="137" font-size="14" font-weight="600" fill="#e7e7ea" text-anchor="middle">3</text>
  <text x="718" y="138" font-size="15" font-weight="600" fill="#e7e7ea">Add the connector</text>
  <text x="684" y="172" font-size="12.5" fill="#e7e7ea">grok.com/connectors &#8594; Custom,</text>
  <text x="684" y="194" font-size="12.5" fill="#e7e7ea">paste tunnel URL + /mcp,</text>
  <text x="684" y="216" font-size="12.5" fill="#e7e7ea">approve with LOCUM_TOKEN</text>

  <text x="32" y="296" font-size="12" fill="#9a9aa4">Staying up after reboot? <tspan font-family="ui-monospace, Menlo, Consolas, monospace" fill="#e7e7ea">./install-agent.sh</tspan> keeps the server alive, <tspan font-family="ui-monospace, Menlo, Consolas, monospace" fill="#e7e7ea">./install-service.sh</tspan> keeps the tunnel alive.</text>
</svg>
