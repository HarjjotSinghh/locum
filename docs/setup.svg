<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="m-arrow"/>
    </marker>
  </defs>
  <style>
    .t-title { fill: #1f2328; } .t-sub { fill: #59636e; }
    .t-node { fill: #1f2328; } .t-nsub { fill: #59636e; }
    .box { fill: #ffffff; stroke: #d0d7de; }
    .num { fill: #f6f8fa; stroke: #d0d7de; }
    .arrow { stroke: #818b98; } .m-arrow { fill: #818b98; }
    @media (prefers-color-scheme: dark) {
      .t-title { fill: #e7e7ea; } .t-sub { fill: #9a9aa4; }
      .t-node { fill: #e7e7ea; } .t-nsub { fill: #9a9aa4; }
      .box { fill: #141417; stroke: #26262c; }
      .num { fill: #1a1a1e; stroke: #26262c; }
      .arrow { stroke: #6e6e78; } .m-arrow { fill: #6e6e78; }
    }
  </style>
  <text x="32" y="46" font-size="20" font-weight="600" class="t-title">Running in three steps</text>
  <text x="32" y="70" font-size="13" class="t-sub">About ten minutes, most of it waiting on logins.</text>

  <rect x="24" y="100" width="280" height="150" rx="12" class="box"/>
  <circle cx="54" cy="132" r="14" class="num"/>
  <text x="54" y="137" font-size="14" font-weight="600" class="t-node" text-anchor="middle">1</text>
  <text x="78" y="138" font-size="15" font-weight="600" class="t-node">Start the server</text>
  <text x="44" y="172" font-size="12" class="t-node" font-family="ui-monospace, Menlo, Consolas, monospace">cp .env.example .env</text>
  <text x="44" y="194" font-size="12" class="t-node" font-family="ui-monospace, Menlo, Consolas, monospace">uv run server.py</text>
  <text x="44" y="224" font-size="11" class="t-nsub">set LOCUM_TOKEN + LOCUM_ROOTS first</text>

  <line x1="306" y1="175" x2="342" y2="175" class="arrow" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="344" y="100" width="280" height="150" rx="12" class="box"/>
  <circle cx="374" cy="132" r="14" class="num"/>
  <text x="374" y="137" font-size="14" font-weight="600" class="t-node" text-anchor="middle">2</text>
  <text x="398" y="138" font-size="15" font-weight="600" class="t-node">Open the tunnel</text>
  <text x="364" y="172" font-size="12" class="t-node" font-family="ui-monospace, Menlo, Consolas, monospace">cloudflared tunnel</text>
  <text x="364" y="194" font-size="12" class="t-node" font-family="ui-monospace, Menlo, Consolas, monospace">--url http://127.0.0.1:8791</text>
  <text x="364" y="224" font-size="11" class="t-nsub">grab a stable hostname after</text>

  <line x1="626" y1="175" x2="662" y2="175" class="arrow" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="664" y="100" width="272" height="150" rx="12" class="box"/>
  <circle cx="694" cy="132" r="14" class="num"/>
  <text x="694" y="137" font-size="14" font-weight="600" class="t-node" text-anchor="middle">3</text>
  <text x="718" y="138" font-size="15" font-weight="600" class="t-node">Add the connector</text>
  <text x="684" y="172" font-size="12.5" class="t-node">grok.com/connectors &#8594; Custom,</text>
  <text x="684" y="194" font-size="12.5" class="t-node">paste tunnel URL + /mcp,</text>
  <text x="684" y="216" font-size="12.5" class="t-node">approve with LOCUM_TOKEN</text>

  <text x="32" y="296" font-size="12" class="t-nsub">Staying up after reboot? <tspan class="t-node" font-family="ui-monospace, Menlo, Consolas, monospace">./install-agent.sh</tspan> keeps the server alive, <tspan class="t-node" font-family="ui-monospace, Menlo, Consolas, monospace">./install-service.sh</tspan> keeps the tunnel alive.</text>
</svg>
